workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - validate

default:
  interruptible: true

variables:
  POSTGRES_DB: "notes_test"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgres:5432/notes_test"
  SECRET_KEY: "ci-secret-key"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"

frontend_validate:
  stage: validate
  image: node:22-bullseye
  cache:
    key: "frontend-${CI_COMMIT_REF_SLUG}"
    paths:
      - frontend/node_modules/
      - frontend/.npm/
  script:
    - bash ci/benchmark/run_with_timer.sh ci/benchmark-results/gitlab_frontend.csv frontend_npm_ci "cd frontend && npm ci --cache .npm --prefer-offline"
    - bash ci/benchmark/run_with_timer.sh ci/benchmark-results/gitlab_frontend.csv frontend_lint "cd frontend && npm run lint"
    - bash ci/benchmark/run_with_timer.sh ci/benchmark-results/gitlab_frontend.csv frontend_build "cd frontend && npm run build"
  artifacts:
    when: always
    paths:
      - ci/benchmark-results/gitlab_frontend.csv
    expire_in: 14 days

backend_tests:
  stage: validate
  image: python:3.11-slim
  services:
    - name: postgres:16
      alias: postgres
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: "backend-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip/
  script:
    - python -m pip install --upgrade pip
    - bash ci/benchmark/run_with_timer.sh ci/benchmark-results/gitlab_backend.csv backend_pip_install "cd backend && pip install -r requirements.txt"
    - bash ci/benchmark/run_with_timer.sh ci/benchmark-results/gitlab_backend.csv backend_pytest_install "cd backend && pip install pytest"
    - |
      python - << 'PY'
      import os
      import time
      import psycopg

      db_url = os.environ["DATABASE_URL"]
      for attempt in range(30):
          try:
              with psycopg.connect(db_url):
                  print("PostgreSQL is ready")
                  break
          except Exception:
              time.sleep(2)
      else:
          raise RuntimeError("PostgreSQL did not become ready in time")
      PY
    - bash ci/benchmark/run_with_timer.sh ci/benchmark-results/gitlab_backend.csv backend_pytest "cd backend && pytest app/tests -q"
  artifacts:
    when: always
    paths:
      - ci/benchmark-results/gitlab_backend.csv
    expire_in: 14 days
