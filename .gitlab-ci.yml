workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - validate

default:
  interruptible: true

variables:
  POSTGRES_DB: "notes_test"
  POSTGRES_USER: "postgres"
  POSTGRES_HOST_AUTH_METHOD: "trust"
  DATABASE_URL: "postgresql+psycopg://postgres@postgres:5432/notes_test"
  SECRET_KEY: "ci-secret-key"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"

frontend_validate:
  stage: validate
  image: node:22-bullseye
  # Cache path: frontend/.pnpm-store/
  # Cache key: frontend-${CI_COMMIT_REF_SLUG}
  # Invalidation: changing branches creates a different cache key; clear runner cache for a forced cold run.
  cache:
    key: "frontend-${CI_COMMIT_REF_SLUG}"
    paths:
      - frontend/.pnpm-store/
  script:
    - mkdir -p ci/benchmark-results
    - echo "metric,duration_seconds" > ci/benchmark-results/gitlab_frontend.csv
    - echo "cache_restore_time,0" >> ci/benchmark-results/gitlab_frontend.csv
    - corepack enable
    - cd frontend
    - pnpm config set store-dir .pnpm-store
    - bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/gitlab_frontend.csv frontend_pnpm_install "pnpm install --frozen-lockfile"
    - bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/gitlab_frontend.csv frontend_lint "pnpm run lint"
    - bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/gitlab_frontend.csv frontend_build "pnpm run build"
    - echo "cache_save_time,0" >> ../ci/benchmark-results/gitlab_frontend.csv
  artifacts:
    when: always
    paths:
      - ci/benchmark-results/gitlab_frontend.csv
    expire_in: 14 days

backend_tests:
  stage: validate
  image: python:3.11-slim
  services:
    - name: postgres:16
      alias: postgres
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Cache path: .cache/pip/
  # Cache key: backend-${CI_COMMIT_REF_SLUG}
  # Invalidation: changing branches creates a different cache key; clear runner cache for a forced cold run.
  cache:
    key: "backend-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip/
  script:
    - mkdir -p ci/benchmark-results
    - echo "metric,duration_seconds" > ci/benchmark-results/gitlab_backend.csv
    - echo "cache_restore_time,0" >> ci/benchmark-results/gitlab_backend.csv
    - python -m pip install --upgrade pip
    - cd backend
    - bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/gitlab_backend.csv backend_pip_install "pip install -r requirements.txt"
    - bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/gitlab_backend.csv backend_pytest_install "pip install pytest==8.3.4"
    - |
      python - << 'PY'
      import os
      import time
      import psycopg

      db_url = os.environ["DATABASE_URL"]
      for attempt in range(30):
          try:
              with psycopg.connect(db_url):
                  print("PostgreSQL is ready")
                  break
          except Exception:
              time.sleep(2)
      else:
          raise RuntimeError("PostgreSQL did not become ready in time")
      PY
    - bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/gitlab_backend.csv backend_pytest "pytest app/tests -q"
    - echo "cache_save_time,0" >> ../ci/benchmark-results/gitlab_backend.csv
  artifacts:
    when: always
    paths:
      - ci/benchmark-results/gitlab_backend.csv
    expire_in: 14 days
