name: CI GithubActions

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/github_frontend.csv frontend_npm_ci "npm ci"

      - name: Lint
        run: |
          bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/github_frontend.csv frontend_lint "npm run lint"

      - name: Build
        run: |
          bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/github_frontend.csv frontend_build "npm run build"

      - name: Upload frontend benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-frontend-benchmark
          path: ci/benchmark-results/github_frontend.csv

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/notes_test
      SECRET_KEY: ci-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/github_backend.csv backend_pip_install "pip install -r requirements.txt"
          bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/github_backend.csv backend_pytest_install "pip install pytest"

      - name: Wait for PostgreSQL
        run: |
          python - << 'PY'
          import os
          import time
          import psycopg

          db_url = os.environ["DATABASE_URL"]
          for attempt in range(30):
              try:
                  with psycopg.connect(db_url):
                      print("PostgreSQL is ready")
                      break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError("PostgreSQL did not become ready in time")
          PY

      - name: Run tests
        run: |
          bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/github_backend.csv backend_pytest "pytest app/tests -q"

      - name: Upload backend benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-backend-benchmark
          path: ci/benchmark-results/github_backend.csv
