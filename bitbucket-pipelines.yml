definitions:
  caches:
    pip: ~/.cache/pip
  services:
    postgres:
      image: postgres:16
      variables:
        POSTGRES_DB: notes_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres

  steps:
    - step: &frontend_validate
        name: Frontend Validate
        image: node:22
        caches:
          - node
        script:
          - bash ci/benchmark/run_with_timer.sh ci/benchmark-results/bitbucket_frontend.csv frontend_npm_ci "cd frontend && npm ci"
          - bash ci/benchmark/run_with_timer.sh ci/benchmark-results/bitbucket_frontend.csv frontend_lint "cd frontend && npm run lint"
          - bash ci/benchmark/run_with_timer.sh ci/benchmark-results/bitbucket_frontend.csv frontend_build "cd frontend && npm run build"
        artifacts:
          - ci/benchmark-results/bitbucket_frontend.csv

    - step: &backend_tests
        name: Backend Tests
        image: python:3.11
        services:
          - postgres
        caches:
          - pip
        script:
          - export DATABASE_URL="postgresql+psycopg://postgres:postgres@127.0.0.1:5432/notes_test"
          - export SECRET_KEY="ci-secret-key"
          - export ACCESS_TOKEN_EXPIRE_MINUTES="30"
          - python -m pip install --upgrade pip
          - bash ci/benchmark/run_with_timer.sh ci/benchmark-results/bitbucket_backend.csv backend_pip_install "cd backend && pip install -r requirements.txt"
          - bash ci/benchmark/run_with_timer.sh ci/benchmark-results/bitbucket_backend.csv backend_pytest_install "cd backend && pip install pytest"
          - |
            python - << 'PY'
            import os
            import time
            import psycopg

            db_url = os.environ["DATABASE_URL"]
            for attempt in range(30):
                try:
                    with psycopg.connect(db_url):
                        print("PostgreSQL is ready")
                        break
                except Exception:
                    time.sleep(2)
            else:
                raise RuntimeError("PostgreSQL did not become ready in time")
            PY
          - bash ci/benchmark/run_with_timer.sh ci/benchmark-results/bitbucket_backend.csv backend_pytest "cd backend && pytest app/tests -q"
        artifacts:
          - ci/benchmark-results/bitbucket_backend.csv

pipelines:
  branches:
    "**":
      - parallel:
          - step: *frontend_validate
          - step: *backend_tests

  pull-requests:
    "**":
      - parallel:
          - step: *frontend_validate
          - step: *backend_tests
