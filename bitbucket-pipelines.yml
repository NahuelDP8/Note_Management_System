definitions:
  caches:
    # Cache path: ~/.cache/pip
    # Cache key: managed by Bitbucket for this cache name and branch context.
    # Invalidation: clear Bitbucket caches or change dependency inputs for a practical cold run.
    pip: ~/.cache/pip
    # Cache path: frontend/.pnpm-store
    # Cache key: managed by Bitbucket for this cache name and branch context.
    # Invalidation: clear Bitbucket caches or change dependency inputs for a practical cold run.
    pnpm: frontend/.pnpm-store
  services:
    postgres:
      image: postgres:16
      variables:
        POSTGRES_DB: notes_test
        POSTGRES_USER: postgres
        POSTGRES_HOST_AUTH_METHOD: trust

  steps:
    - step: &frontend_validate
        name: Frontend Validate
        image: node:22
        caches:
          - pnpm
        script:
          - mkdir -p ci/benchmark-results
          - echo "metric,duration_seconds" > ci/benchmark-results/bitbucket_frontend.csv
          - echo "cache_restore_time,0" >> ci/benchmark-results/bitbucket_frontend.csv
          - corepack enable
          - cd frontend
          - pnpm config set store-dir .pnpm-store
          - bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/bitbucket_frontend.csv frontend_pnpm_install "pnpm install --frozen-lockfile"
          - bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/bitbucket_frontend.csv frontend_lint "pnpm run lint"
          - bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/bitbucket_frontend.csv frontend_build "pnpm run build"
          - echo "cache_save_time,0" >> ../ci/benchmark-results/bitbucket_frontend.csv
        artifacts:
          - ci/benchmark-results/bitbucket_frontend.csv

    - step: &backend_tests
        name: Backend Tests
        image: python:3.11
        services:
          - postgres
        caches:
          - pip
        script:
          - mkdir -p ci/benchmark-results
          - echo "metric,duration_seconds" > ci/benchmark-results/bitbucket_backend.csv
          - echo "cache_restore_time,0" >> ci/benchmark-results/bitbucket_backend.csv
          - export DATABASE_URL="postgresql+psycopg://postgres@127.0.0.1:5432/notes_test"
          - export SECRET_KEY="ci-secret-key"
          - export ACCESS_TOKEN_EXPIRE_MINUTES="30"
          - cd backend
          - python -m pip install --upgrade pip
          - bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/bitbucket_backend.csv backend_pip_install "pip install -r requirements.txt"
          - bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/bitbucket_backend.csv backend_pytest_install "pip install pytest==8.3.4"
          - |
            python - << 'PY'
            import os
            import time
            import psycopg

            db_url = os.environ["DATABASE_URL"]
            for attempt in range(30):
                try:
                    with psycopg.connect(db_url):
                        print("PostgreSQL is ready")
                        break
                except Exception:
                    time.sleep(2)
            else:
                raise RuntimeError("PostgreSQL did not become ready in time")
            PY
          - bash ../ci/benchmark/run_with_timer.sh ../ci/benchmark-results/bitbucket_backend.csv backend_pytest "pytest app/tests -q"
          - echo "cache_save_time,0" >> ../ci/benchmark-results/bitbucket_backend.csv
        artifacts:
          - ci/benchmark-results/bitbucket_backend.csv

pipelines:
  branches:
    "**":
      - parallel:
          - step: *frontend_validate
          - step: *backend_tests

  pull-requests:
    "**":
      - parallel:
          - step: *frontend_validate
          - step: *backend_tests
